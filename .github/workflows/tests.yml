name: Audit checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: academy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOT_TOKEN: '123456:TEST'
      OWNER_TELEGRAM_ID: '1'
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/academy_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install '.[dev]'
      - run: python -m compileall -q app tests alembic
      - run: ruff check app tests --select F821,F822,F823,E9
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q --cov=app --cov-branch --cov-report=xml
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
