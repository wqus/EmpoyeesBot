[project]
name='employee-training-bot'
version='1.0.0'
requires-python='>=3.12'
dependencies=['aiogram>=3.15,<4','SQLAlchemy>=2.0,<3','asyncpg>=0.30,<1','alembic>=1.14,<2','pydantic-settings>=2.7,<3']
[project.optional-dependencies]
dev=['pytest>=9.0.3,<10','pytest-asyncio>=1,<2','pytest-cov>=7,<8','ruff>=0.15,<1','pip-audit>=2.10,<3']
[tool.pytest.ini_options]
asyncio_mode='auto'
pythonpath=['.']
asyncio_default_fixture_loop_scope='function'

[build-system]
requires=['setuptools>=77']
build-backend='setuptools.build_meta'

[tool.setuptools.packages.find]
include=['app*']

[tool.setuptools.package-data]
app=['content/*.json']
